<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육지원청 바로가기</title>
<style>
  /* 미리보기용 페이지 바탕 (홈페이지에 붙일 때는 필요 없어요) */
  body { margin: 0; padding: 40px 16px; background: #fff; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }

  /* ===== 여기부터 홈페이지에 붙일 스타일 ===== */
  .edu-office { max-width: 1450px; margin: 0 auto; color: #222; }
  .edu-office__head { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
  .edu-office__head h2 { margin: 0; font-size: 30px; font-weight: 800; white-space: nowrap; }
  .edu-office__head::after { content: ""; flex: 1; height: 1px; background: #dfe3e8; }
  .edu-office__desc { margin: 0 0 24px; font-size: 15px; color: #666; }
  .edu-office__list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin: 0; padding: 0; list-style: none; }
  .edu-office__card { display: block; height: 100%; box-sizing: border-box; padding: 24px 22px; border: 1px solid #e3e6ea; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .edu-office__card:hover, .edu-office__card:focus-visible { border-color: #0f9d58; box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-2px); outline: none; }
  .edu-office__tag { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 700; color: #0f9d58; }
  .edu-office__name { display: block; margin-bottom: 14px; font-size: 22px; font-weight: 800; }
  .edu-office__area { display: block; font-size: 15px; color: #555; }
  .edu-office__area b { margin-right: 10px; color: #222; }
  .edu-office__go { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 700; color: #1a3a8f; }
  @media (max-width: 1100px) { .edu-office__list { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px) {
    .edu-office__list { grid-template-columns: 1fr; }
    .edu-office__head h2 { font-size: 24px; }
  }
  /* ===== 여기까지 ===== */
</style>
</head>
<body>

<!-- ===== 여기부터 홈페이지에 붙일 내용 ===== -->

</html>
