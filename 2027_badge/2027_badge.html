<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 우수 정회원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #2a1d08; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #poster { width: 800px; height: 800px; display: block; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<svg id="poster" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 금색 배경 -->
    <radialGradient id="bg" cx="38%" cy="42%" r="75%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.35" stop-color="#f1cf7a"/>
      <stop offset="0.75" stop-color="#c58a2c"/>
      <stop offset="1" stop-color="#7a4c10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#e2b04a"/>
      <stop offset="1" stop-color="#9c6a17"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3302f"/>
      <stop offset="1" stop-color="#c41d24"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d36b"/>
      <stop offset="1" stop-color="#b98a1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b2304" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#5a0d0d" flood-opacity="0.35"/>
    </filter>
    <!-- 동그란 엠블럼 윗부분 글자 경로 -->
    <path id="arcText" d="M 52 200 A 148 148 0 0 1 348 200"/>
    <clipPath id="ballClip"><circle cx="200" cy="168" r="78"/></clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <g id="sparkles"></g>

  <!-- 모서리 장식 -->
  <g id="corner" fill="none" stroke="#8a5a1a" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M18 120 C 18 50, 50 18, 120 18"/>
    <path d="M40 120 C 40 70, 70 40, 120 40"/>
    <path d="M120 18 C 160 18, 175 40, 160 55 C 148 66, 132 56, 140 45"/>
    <path d="M18 120 C 18 160, 40 175, 55 160 C 66 148, 56 132, 45 140"/>
    <path d="M62 62 C 80 50, 98 62, 90 78 C 84 88, 72 82, 76 74"/>
    <circle cx="120" cy="18" r="4" fill="#8a5a1a"/>
    <circle cx="18" cy="120" r="4" fill="#8a5a1a"/>
    <path d="M140 18 L 220 18" stroke-width="1.5"/>
    <path d="M18 140 L 18 220" stroke-width="1.5"/>
  </g>
  <use href="#corner" transform="translate(800,0) scale(-1,1)"/>

  <!-- 빨간 판 -->
  <g filter="url(#softShadow)">
    <rect x="300" y="160" width="470" height="530" fill="url(#red)"/>
  </g>
  <rect x="310" y="170" width="450" height="510" fill="none" stroke="#f3cf6a" stroke-width="1.5" opacity="0.85"/>

  <!-- 빨간 판 글자 -->
  <g font-family="'Noto Sans KR', sans-serif" fill="#fff" text-anchor="end">
    <text x="735" y="282" font-size="96" font-weight="900" letter-spacing="2">2027</text>
    <text x="735" y="362" font-size="60" font-weight="900" letter-spacing="-1">우수 정회원</text>
    <!-- 금색 별 -->
    <path transform="translate(468,312) scale(0.95)" d="M0,-20 L5.9,-8.1 L19,-6.2 L9.5,3.1 L11.8,16.2 L0,10 L-11.8,16.2 L-9.5,3.1 L-19,-6.2 L-5.9,-8.1 Z" fill="url(#gold)" stroke="#7a4c10" stroke-width="1"/>
  </g>

  <g font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="500" fill="#fff" text-anchor="end">
    <text x="735" y="404">이 업소는 한국고습소총연합회 대구지회의</text>
    <text x="735" y="428">정회원으로서 연합회의 엄격한 기준을 지켜</text>
    <text x="735" y="452">바르게 운영되는 <tspan fill="#ffd45e" font-weight="700">모범업소</tspan>,</text>
    <text x="735" y="476">깨끗하게 관리되는 <tspan fill="#ffd45e" font-weight="700">클린업소</tspan>,</text>
    <text x="735" y="500">쾌적한 학습 환경을 제공하는 <tspan fill="#ffd45e" font-weight="700">우수업소</tspan>임을</text>
    <text x="735" y="524">증명합니다.</text>
  </g>

  <!-- 인증 띠 3칸 -->
  <g font-family="'Noto Sans KR', sans-serif" font-weight="700" font-size="14" fill="#fff" text-anchor="middle">
    <rect x="420" y="546" width="320" height="50" fill="#e85a4f" opacity="0.55"/>
    <line x1="526.6" y1="554" x2="526.6" y2="588" stroke="#fff" stroke-opacity="0.5"/>
    <line x1="633.3" y1="554" x2="633.3" y2="588" stroke="#fff" stroke-opacity="0.5"/>
    <text x="473" y="576">대구지회 정회원</text>
    <text x="580" y="576">모범 운영</text>
    <text x="687" y="576">클린 학습환경</text>
  </g>

  <g font-family="'Noto Sans KR', sans-serif" fill="#fff" text-anchor="middle">
    <text x="580" y="645" font-size="26" font-weight="700" letter-spacing="-0.5">한국고습소총연합회 대구지회</text>
  </g>

  <!-- 엠블럼 뒤 빛 -->
  <circle cx="215" cy="425" r="215" fill="url(#glow)"/>

  <!-- ===== 동그란 엠블럼 (첫 번째 사진) ===== -->
  <g transform="translate(25,235) scale(0.95)" filter="url(#shadow)">
    <!-- 바깥 흰 테 + 얇은 파란 선 -->
    <circle cx="200" cy="200" r="198" fill="#fff"/>
    <circle cx="200" cy="200" r="190" fill="none" stroke="#2c4fa3" stroke-width="3"/>
    <!-- 파란 띠 -->
    <circle cx="200" cy="200" r="182" fill="#3a5db3"/>
    <!-- 아래쪽 흰 부분 (리본 모양) -->
    <path d="M 40 288 L 92 288 L 104 300 L 296 300 L 308 288 L 360 288 A 182 182 0 0 1 40 288 Z" fill="#fff"/>
    <!-- 리본 꺾인 부분 -->
    <path d="M 92 288 L 120 262 L 120 300 L 104 300 Z" fill="#2c4fa3"/>
    <path d="M 308 288 L 280 262 L 280 300 L 296 300 Z" fill="#2c4fa3"/>
    <!-- 안쪽 흰 원 -->
    <circle cx="200" cy="176" r="124" fill="#fff"/>
    <rect x="120" y="230" width="160" height="70" fill="#fff"/>

    <!-- 위쪽 둥근 글자 -->
    <text font-family="'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#fff" letter-spacing="1">
      <textPath href="#arcText" startOffset="50%" text-anchor="middle">한국고습소총연합회 대구지회</textPath>
    </text>

    <!-- AKAS 로고 (줄무늬 공) -->
    <g clip-path="url(#ballClip)">
      <ellipse cx="200" cy="110" rx="70" ry="18" fill="#fff"/>
      <path d="M 122 120 Q 200 86 278 120 L 278 128 L 122 128 Z" fill="#1f8a64"/>
      <rect x="110" y="136" width="180" height="15" fill="#1f8a64"/>
      <rect x="110" y="186" width="180" height="15" fill="#33479e"/>
      <path d="M 122 209 L 278 209 L 278 216 Q 200 252 122 216 Z" fill="#33479e"/>
    </g>
    <rect x="104" y="158" width="192" height="22" fill="#111"/>
    <rect x="148" y="156" width="104" height="26" fill="#fff"/>
    <text x="200" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" font-style="italic" fill="#111" text-anchor="middle" letter-spacing="7">AKAS</text>

    <!-- 월계수 -->
    <g id="laurelL"></g>
    <g id="laurelR" transform="translate(400,0) scale(-1,1)"></g>

    <!-- 정회원 -->
    <ellipse cx="200" cy="318" rx="66" ry="32" fill="#1f8a5c"/>
    <text x="200" y="330" font-family="'Noto Sans KR', sans-serif" font-size="33" font-weight="700" fill="#fff" text-anchor="middle">정회원</text>
  </g>
</svg>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  // 반짝이 (매번 같은 모양이 나오도록 고정된 난수 사용)
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const sp = document.getElementById('sparkles');
  for (let i = 0; i < 140; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (rnd() * 800).toFixed(1));
    c.setAttribute('cy', (rnd() * 800).toFixed(1));
    c.setAttribute('r', (0.6 + rnd() * rnd() * 4).toFixed(2));
    c.setAttribute('fill', 'url(#spark)');
    c.setAttribute('opacity', (0.4 + rnd() * 0.6).toFixed(2));
    sp.appendChild(c);
  }
  // 반짝이는 십자 빛
  [[700,110,16],[90,720,14],[760,720,12],[520,110,10],[60,330,10]].forEach(([x,y,s]) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${x},${y-s} Q${x},${y} ${x+s},${y} Q${x},${y} ${x},${y+s} Q${x},${y} ${x-s},${y} Q${x},${y} ${x},${y-s}Z`);
    p.setAttribute('fill', '#fffbe6');
    sp.appendChild(p);
  });

  // 월계수 잎 (왼쪽, 오른쪽은 거울 복사)
  const L = document.getElementById('laurelL');
  const cx = 200, cy = 200, R = 168;
  const stem = document.createElementNS(NS, 'path');
  const a0 = 160 * Math.PI / 180, a1 = 248 * Math.PI / 180;
  const pt = a => [cx + R * Math.cos(a), cy - R * Math.sin(a)];
  const [sx, sy] = pt(a0), [ex, ey] = pt(a1);
  stem.setAttribute('d', `M${sx},${sy} A${R} ${R} 0 0 0 ${ex},${ey}`);
  stem.setAttribute('fill', 'none');
  stem.setAttribute('stroke', '#b98a1e');
  stem.setAttribute('stroke-width', '2.5');
  L.appendChild(stem);
  for (let i = 0; i < 9; i++) {
    const a = a0 + (a1 - a0) * (i / 8);
    const [x, y] = pt(a);
    const tangent = -(a * 180 / Math.PI) - 90; // 줄기 방향
    [-1, 1].forEach(side => {
      if (i === 8 && side === 1) return;
      const leaf = document.createElementNS(NS, 'path');
      leaf.setAttribute('d', 'M0,0 C 5,-6 5,-16 0,-22 C -5,-16 -5,-6 0,0 Z');
      leaf.setAttribute('fill', 'url(#leaf)');
      leaf.setAttribute('stroke', '#9c7016');
      leaf.setAttribute('stroke-width', '0.6');
      leaf.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(tangent + side * 40 + 180).toFixed(1)})`);
      L.appendChild(leaf);
    });
  }
  document.getElementById('laurelR').innerHTML = L.innerHTML;
</script>
</body>
</html>
